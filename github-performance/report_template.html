<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub performance report</title>
<!--
  Template for github_performance.py. It is copied next to the JSON it renders:
    data/manifest.json      - what the run contains
    data/summary.json       - metric definitions, every person's metrics, ranks and scores
    data/org_baseline*.json - anonymous org-wide distributions, one per comparison window (optional)
    data/users/<login>.json - raw per-person data: PRs, reviews, commits, calendar, chart series
  Browsers block fetch() from file://, so open it through the script's local server
  (python github_performance.py --view <report folder>).
-->
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f6f7f9;
  --surface-1: #ffffff;
  --surface-2: #f0f1f3;
  --border: #e3e5e8;
  --grid: #ececec;
  --text-primary: #191919;
  --text-secondary: #666666;
  --series-1: #257de0;
  --accent-soft: #e8f1fc;
  --div-pos: #257de0;
  --div-neg: #ec4647;
  --seq-0: #ebedf0; --seq-1: #b6d5f8; --seq-2: #6aabf1; --seq-3: #257de0; --seq-4: #0f4a96;
  --band: #cce3fd;
  --warn-bg: #fff4e0; --warn-text: #7a4a00;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-0: #111111; --surface-1: #191919; --surface-2: #242424;
    --border: #333333; --grid: #2c2c2c;
    --text-primary: #efefef; --text-secondary: #9c9c9c;
    --series-1: #338ced; --accent-soft: #1a2a3d;
    --div-pos: #338ced; --div-neg: #eb6263;
    --seq-0: #2a2a2a; --seq-1: #0e3d7e; --seq-2: #1b64be; --seq-3: #338ced; --seq-4: #9dc8f7;
    --band: #1d3b63;
    --warn-bg: #3a2c10; --warn-text: #f5c97a;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-0: #111111; --surface-1: #191919; --surface-2: #242424;
  --border: #333333; --grid: #2c2c2c;
  --text-primary: #efefef; --text-secondary: #9c9c9c;
  --series-1: #338ced; --accent-soft: #1a2a3d;
  --div-pos: #338ced; --div-neg: #eb6263;
  --seq-0: #2a2a2a; --seq-1: #0e3d7e; --seq-2: #1b64be; --seq-3: #338ced; --seq-4: #9dc8f7;
  --band: #1d3b63;
  --warn-bg: #3a2c10; --warn-text: #f5c97a;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body.viz-root {
  background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--series-1); text-decoration: none; }
a:hover { text-decoration: underline; }
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--surface-1);
  border-bottom: 1px solid var(--border); padding: 12px 24px;
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
header.top h1 { font-size: 18px; margin: 0; font-weight: 600; }
header.top .meta { color: var(--text-secondary); font-size: 13px; }
header.top .spacer { flex: 1; }
select, button {
  font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
section.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  padding: 18px 20px; margin-bottom: 18px;
}
section.card > h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.banner ul { margin: 4px 0 0 18px; padding: 0; }
.caveat { background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--text-secondary);
          border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; }
.caveat h2 { font-size: 15px; margin: 0 0 6px; }
.caveat ul { margin: 0; padding-left: 20px; }
.caveat li { margin: 4px 0; }

/* person header */
.person { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.person img { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--border); }
.person .name { font-size: 20px; font-weight: 600; }
.person .login { color: var(--text-secondary); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px;
        background: var(--surface-2); color: var(--text-secondary); margin-left: 6px; vertical-align: middle; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-1); }
.tile .label { color: var(--text-secondary); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 600; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile .rank { font-size: 12px; color: var(--text-secondary); }
.score-tiles .tile .value { font-size: 22px; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 3px; background: var(--series-1); }

/* tables */
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
th { font-weight: 600; font-size: 12px; color: var(--text-secondary); cursor: pointer; user-select: none; }
th.sorted::after { content: " \2193"; }
th.sorted.asc::after { content: " \2191"; }
tbody tr:hover { background: var(--surface-2); }
tr.selected { background: var(--accent-soft) !important; }
td.wrap { white-space: normal; text-align: left; max-width: 420px; }
.scroll { overflow: auto; max-height: 520px; }
td.score { font-weight: 600; }
.muted { color: var(--text-secondary); }
.parent-row td { font-weight: 600; border-top: 1px solid var(--border); }
.child-row td:first-child { padding-left: 26px; }
.child-row td { color: var(--text-secondary); }
.group-row td { background: var(--surface-2); font-weight: 600; text-align: left; }

/* charts */
.chart-title { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
svg text { fill: var(--text-secondary); font-size: 11px; }
svg .axis { stroke: var(--border); stroke-width: 1; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
.hbar { display: grid; grid-template-columns: minmax(120px, 38%) 1fr 64px; gap: 8px; align-items: center; margin: 3px 0; font-size: 13px; }
.hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 10px; }
.hbar .fill { height: 10px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.hbar .num { text-align: right; font-variant-numeric: tabular-nums; }
.strip-row { display: grid; grid-template-columns: 200px 1fr 120px; gap: 12px; align-items: center; padding: 6px 0;
             border-bottom: 1px solid var(--grid); }
.strip-row .v { text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; margin-top: 6px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--surface-1); color: var(--text-primary);
       border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px;
       box-shadow: 0 4px 14px rgba(0,0,0,.15); max-width: 320px; display: none; white-space: pre-line; }
.empty { color: var(--text-secondary); font-style: italic; padding: 12px 0; }
.toggle { display: inline-flex; gap: 0; }
.toggle button { border-radius: 0; }
.toggle button:first-child { border-radius: 6px 0 0 6px; }
.toggle button:last-child { border-radius: 0 6px 6px 0; }
.toggle button.on { background: var(--accent-soft); border-color: var(--series-1); }
input[type=search] { font: inherit; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
                     background: var(--surface-1); color: var(--text-primary); }
</style>
</head>
<body class="viz-root">
<header class="top">
  <h1>GitHub performance</h1>
  <span class="meta" id="meta">loading...</span>
  <span class="spacer"></span>
  <label>Person <select id="person-select"></select></label>
  <button id="theme-btn" title="Switch light / dark">Theme</button>
</header>
<main id="app"><p class="empty">Loading report data...</p></main>
<div id="tip" role="tooltip"></div>
<!-- All report data as one script: lets this page work from file:// (missing in old reports: then fetch is used) -->
<script src="data/report-data.js"></script>

<script>
"use strict";
// ------------------------------------------------------------------ helpers
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SVGNS = "http://www.w3.org/2000/svg";
const state = { manifest: null, summary: null, baselines: {}, users: {}, defs: {}, current: null, prSort: {key: "createdAt", asc: false} };

function fmt(v, unit) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  switch (unit) {
    case "pct": return Math.round(v * 100) + "%";
    case "hours": return v < 48 ? v.toFixed(1) + " h" : (v / 24).toFixed(1) + " d";
    case "num": return (+v).toFixed(2).replace(/\.?0+$/, "") || "0";
    default: return Math.round(v).toLocaleString();
  }
}
const fmtPct = p => p === null || p === undefined ? "–" : "P" + Math.round(p);
const date10 = s => s ? s.slice(0, 10) : "";
const hoursBetween = (a, b) => a && b ? Math.max((new Date(b) - new Date(a)) / 3.6e6, 0) : null;

// diverging cell tint for a 0..100 "good end = 100" score; the number is always printed too
function scoreStyle(score) {
  if (score === null || score === undefined) return "";
  const d = (score - 50) / 50;                       // -1 .. 1
  const color = d >= 0 ? "var(--div-pos)" : "var(--div-neg)";
  const pct = Math.round(Math.abs(d) * 38);
  return `background: color-mix(in srgb, ${color} ${pct}%, transparent)`;
}

// one tooltip for the whole page: any element with data-tip shows it
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.getAttribute("data-tip");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

function svg(tag, attrs = {}, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}
// bar with 4px rounded data-end, square on the baseline
function topRoundedBar(x, y, w, h, r = 4) {
  if (h <= 0) return "";
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

// ------------------------------------------------------------------ charts
function barChart(el, rows, { key, label, title, unit = "count", height = 150 }) {
  el.innerHTML = `<div class="chart-title">${esc(title)}</div>`;
  const W = Math.max(el.clientWidth || 300, 260), H = height, m = { t: 8, r: 6, b: 22, l: 34 };
  const s = svg("svg", { width: W, height: H, role: "img", "aria-label": title }, el);
  const max = niceMax(Math.max(...rows.map(r => r[key]), 0));
  const iw = W - m.l - m.r, ih = H - m.t - m.b, step = iw / rows.length, bw = Math.max(step - 2, 1);
  for (const t of [0, 0.5, 1]) {
    const y = m.t + ih - t * ih;
    svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, class: t === 0 ? "axis" : "gridline" }, s);
    svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, s).textContent = fmt(max * t, unit);
  }
  const labelEvery = Math.ceil(rows.length / Math.max(Math.floor(iw / 34), 1));
  rows.forEach((r, i) => {
    const x = m.l + i * step + 1, h = (r[key] / max) * ih;
    const g = svg("g", { "data-tip": `${label(r)}\n${title}: ${fmt(r[key], unit)}` }, s);
    svg("rect", { x: m.l + i * step, y: m.t, width: step, height: ih, fill: "transparent" }, g);  // hit target
    if (h > 0) svg("path", { d: topRoundedBar(x, m.t + ih - h, bw, h), fill: "var(--series-1)" }, g);
    if (i % labelEvery === 0)
      svg("text", { x: x + bw / 2, y: H - 6, "text-anchor": "middle" }, s).textContent = label(r, true);
  });
}

function hbars(el, rows, { label, value, unit = "count", tipFn, max }) {
  if (!rows.length) { el.innerHTML = `<p class="empty">Nothing in this window.</p>`; return; }
  max = max || Math.max(...rows.map(value), 1);
  el.innerHTML = rows.map(r => `
    <div class="hbar" data-tip="${esc(tipFn ? tipFn(r) : label(r) + ": " + fmt(value(r), unit))}">
      <span class="lbl">${esc(label(r))}</span>
      <span class="track"><span class="fill" style="display:block;width:${(100 * value(r) / max).toFixed(1)}%"></span></span>
      <span class="num">${fmt(value(r), unit)}</span>
    </div>`).join("");
}

function calendar(el, days) {
  const cell = 12, gap = 2, step = cell + gap, top = 16, left = 28;
  const first = new Date(days[0].date + "T00:00:00Z");
  const offset = first.getUTCDay();
  const weeks = Math.ceil((days.length + offset) / 7);
  const W = left + weeks * step + 4, H = top + 7 * step + 4;
  el.innerHTML = "";
  const s = svg("svg", { width: W, height: H, role: "img", "aria-label": "Daily activity calendar" }, el);
  const max = Math.max(...days.map(d => d.count), 1);
  const thresholds = [0, Math.max(1, max * 0.15), max * 0.35, max * 0.65];
  const level = c => c === 0 ? 0 : c <= thresholds[1] ? 1 : c <= thresholds[2] ? 2 : c <= thresholds[3] ? 3 : 4;
  ["Mon", "Wed", "Fri"].forEach((d, i) =>
    svg("text", { x: 0, y: top + (1 + 2 * i) * step + cell - 2 }, s).textContent = d);
  let lastMonth = -1;
  days.forEach((d, i) => {
    const idx = i + offset, wk = Math.floor(idx / 7), dow = idx % 7;
    const dt = new Date(d.date + "T00:00:00Z");
    if (dow === 0 && dt.getUTCMonth() !== lastMonth && dt.getUTCDate() <= 7) {
      lastMonth = dt.getUTCMonth();
      svg("text", { x: left + wk * step, y: 11 }, s).textContent = MONTHS[lastMonth];
    }
    svg("rect", {
      x: left + wk * step, y: top + dow * step, width: cell, height: cell, rx: 2,
      fill: `var(--seq-${level(d.count)})`,
      "data-tip": `${d.date}\n${d.count} activities: ${d.commits} commits, ${d.prs} PRs opened, ${d.reviews} reviews`,
    }, s);
  });
  const lg = document.createElement("div");
  lg.className = "legend";
  lg.innerHTML = "Less " + [0, 1, 2, 3, 4].map(l => `<span class="sw" style="background:var(--seq-${l})"></span>`).join("") + " More";
  el.appendChild(lg);
}

// "<definition>\nHow to read it: <good / bad>" for any metric
const metricTip = d => d ? `${d.label}: ${d.desc}${d.read ? `\nHow to read it: ${d.read}` : ""}` : "";

// What every table column means and how to read it, keyed by the header text.
const COLUMN_TIPS = {
  // overview
  "Person": "The person analysed. 'peer' = added only for comparison.",
  "Compared over": "The days their numbers are compared on. Shorter than the report window for people who joined during it.",
  "Delivery": "Group score 0-100: average percentile of the delivery metrics (PRs, merges, size, speed). 50 = typical, higher = better.",
  "Quality & process": "Group score 0-100: description, tests, change requests, self-merges. 50 = typical, higher = better.",
  "Code review": "Group score 0-100: how much and how well they review others' PRs. 50 = typical, higher = better.",
  "Collaboration": "Group score 0-100: breadth of people and repos they help. 50 = typical, higher = better.",
  "Consistency": "Group score 0-100: how steady their activity is. 50 = typical, higher = better.",
  // all metrics
  "Metric": "Hover a metric name for its definition and how to read it.",
  "Value": "This person's number over the whole report window.",
  "Cohort median": "Middle value of the people in this report, over the same days. Half are above, half below.",
  "Cohort pct": "Percentile among the people in this report: P75 = higher than 75% of them. Not good or bad by itself; see Direction.",
  "Org median": "Middle value of active company members over the same days.",
  "Org pct": "Percentile among active company members: P75 = higher than 75% of them. Not good or bad by itself; see Direction.",
  "Score": "The percentile turned so that 100 is always the good end. Above 50 = better than typical, below 50 = worse. Blank = context-only metric.",
  "Direction": "Whether higher or lower is better. 'Context only' = neither; read it together with other numbers.",
  // work mix
  "Languages": "Programming and file languages in this area, as a share of its changed lines. Hover one for lines and files.",
  "Frameworks & tools": "Frameworks, libraries and tools used where they worked in this area. The number = how many of their PRs it applies to. Hover for where it was found.",
  "Area": "Part of the system a PR mainly changes. Bold = top-level area (Backend, Frontend...), indented = its parts. A PR counts once, in the part with most of its real changes (tests, config and docs give way to code).",
  "Change type": "Why the PR was made, from its title, branch or files.",
  "PRs (main area)": "PRs whose main area is this one, and their share of all PRs. Each PR is counted once.",
  "PRs (main type)": "PRs of this change type, and their share of all PRs. Each PR is counted once.",
  "Touched by": "PRs with at least one file in this area, even if their main area is another. Higher than the main count means it is often a side change.",
  "Line share": "Share of all changed lines (lock and generated files count as a few lines). Shows where the volume goes.",
  "Merged": "How many of those PRs are merged. Much lower than the PR count means work is open or abandoned.",
  "Lines +": "Lines added by those PRs. Volume only, not value.",
  "Lines −": "Lines deleted by those PRs. Deleting code is often good.",
  "Median size": "Typical PR size (lines added + deleted). Lower is easier to review; above ~400 is large.",
  "Median open → merged": "Typical time from opening to merging. Lower is better; hours to a few days is healthy.",
  "Repos": "Distinct repositories those PRs are in.",
  "With tests": "Share of those PRs that also change test files. Higher is better for code changes.",
  "Type \\ area": "Rows: change type. Columns: main area. Each cell = PRs of that type in that area; darker = more.",
  "Total": "PRs in this row.",
  // PR list
  "Repo": "Repository the PR is in.",
  "Title": "PR title; click the number to open it on GitHub.",
  "Type": "Why the PR was made, from its title, branch or files.",
  "State": "MERGED, OPEN or CLOSED (closed without merging).",
  "Opened": "Date the PR was opened.",
  "Lines": "Lines added + deleted. Smaller PRs are easier to review.",
  "Files": "Files changed.",
  "Commits": "Commits on the PR branch. Many can mean long iteration or rework.",
  "Open → merged": "Time from opening to merging. Lower is better; blank = not merged.",
  "Human reviews": "Reviews by people other than the author (bots excluded). 0 on a merged PR means nobody reviewed it.",
  "Merged by": "Who clicked merge. The author merging their own unapproved PR is a process risk.",
  // reviews given
  "Submitted": "When they submitted the review.",
  "PR": "The PR they reviewed; click to open it.",
  "Author": "Who wrote the PR.",
  "Outcome": "APPROVED, CHANGES_REQUESTED (blocking feedback) or COMMENTED (feedback without a verdict).",
  "Inline comments": "Line comments in this review. 0 on an approval with no other comment = silent approval.",
  "PR lines": "Size of the reviewed PR. Large PRs approved within minutes deserve a second look.",
  "Hours after PR opened": "How soon they reviewed after the PR was opened. Lower unblocks teammates sooner.",
  // run cost
  "Stored data reused": "Whether data saved by an earlier run (same data version) was reused instead of fetched again.",
  "Ranges fetched this run": "Date ranges fetched from GitHub this time. 'none' = everything came from stored data.",
};
// Table headers are rendered in many places: fill their tooltips from COLUMN_TIPS.
const headerName = th => th.textContent.replace(/\s+/g, " ").trim();
new MutationObserver(() => document.querySelectorAll("#app th").forEach(th => {
  const tip = COLUMN_TIPS[headerName(th)];
  if (tip && th.getAttribute("data-tip") !== tip) th.setAttribute("data-tip", tip);
})).observe(document.getElementById("app"), { childList: true, subtree: true });

const baselineFor = p => state.baselines[p.comparison?.org_file] || null;
const joinedLate = p => p.comparison && p.comparison.from !== state.summary.from;
const windowText = p => `${date10(p.comparison.from)} \u2192 ${date10(p.comparison.to)} (${p.comparison.days} days)`;

// person's value against a distribution: IQR band, median tick, p90 tick, person dot
function distStrip(el, rows, { who, population, n, medianLabel = "median" }) {
  if (!rows.length) { el.innerHTML = `<p class="empty">No comparison data.</p>`; return; }
  el.innerHTML = "";
  for (const d of rows) {
    const b = d.stats, value = d.value, vals = b.values || [];
    const p95 = vals.length ? vals[Math.floor((vals.length - 1) * 0.95)] : 0;
    const max = Math.max(p95, value ?? 0, b.p90 ?? 0, 1) * 1.05;
    const pos = v => `${Math.min(100, 100 * (v ?? 0) / max).toFixed(2)}%`;
    const row = document.createElement("div");
    row.className = "strip-row";
    row.innerHTML = `
      <div data-tip="${esc(d.tip || d.label)}"><div>${esc(d.label)}</div><div class="muted" style="font-size:12px">${medianLabel} ${fmt(b.median, d.unit)}</div></div>
      <div style="position:relative;height:26px" data-tip="${esc(`${d.label}\n${who}: ${fmt(value, d.unit)} (${fmtPct(d.pct)} of ${n} ${population})\np25 ${fmt(b.p25, d.unit)} · median ${fmt(b.median, d.unit)} · p75 ${fmt(b.p75, d.unit)} · p90 ${fmt(b.p90, d.unit)} · max ${fmt(b.max, d.unit)}`)}">
        <div style="position:absolute;left:0;right:0;top:12px;height:2px;background:var(--grid)"></div>
        <div style="position:absolute;left:${pos(b.p25)};width:calc(${pos(b.p75)} - ${pos(b.p25)});top:7px;height:12px;background:var(--band);border-radius:3px"></div>
        <div style="position:absolute;left:${pos(b.median)};top:4px;width:2px;height:18px;background:var(--text-secondary)"></div>
        <div style="position:absolute;left:${pos(b.p90)};top:8px;width:1px;height:10px;background:var(--text-secondary)"></div>
        ${value === null || value === undefined ? "" :
          `<div style="position:absolute;left:calc(${pos(value)} - 6px);top:7px;width:12px;height:12px;border-radius:50%;background:var(--series-1);box-shadow:0 0 0 2px var(--surface-1)"></div>`}
      </div>
      <div class="v"><b>${fmt(value, d.unit)}</b> <span class="muted">${fmtPct(d.pct)}</span></div>`;
    el.appendChild(row);
  }
  const lg = document.createElement("div");
  lg.className = "legend";
  lg.innerHTML = `<span><span class="sw" style="background:var(--series-1);border-radius:50%"></span>${esc(who)}</span>
    <span><span class="sw" style="background:var(--band)"></span>middle 50% (p25-p75)</span>
    <span><span class="sw" style="background:var(--text-secondary);width:2px"></span>median</span>
    <span class="muted">thin tick = p90 · P = percentile among ${n} ${population}</span>`;
  el.appendChild(lg);
}

function orgStrip(el, metrics, person) {
  const base = baselineFor(person);
  const rows = metrics.filter(d => base?.metrics?.[d.key]).map(d => {
    const r = person.ranks[d.key] || {};
    return { label: d.label, tip: metricTip(d), unit: d.unit, value: r.org_value ?? person.metrics[d.key], pct: r.org_pct, stats: base.metrics[d.key] };
  });
  if (!rows.length) { el.innerHTML = `<p class="empty">No organisation baseline in this report (run without --no-baseline).</p>`; return; }
  distStrip(el, rows, { who: person.login, population: "active members", n: base.active_members, medianLabel: "org median" });
}

const tenureText = d => d < 60 ? `${d} days` : d < 730 ? `${(d / 30.4).toFixed(1)} months` : `${(d / 365).toFixed(1)} years`;

function renderTenure(el, login) {
  const p = state.summary.people.find(x => x.login === login), t = p.tenure;
  if (!t) { el.innerHTML = `<h2>Compared with members of similar tenure</h2><p class="empty">Not available: needs the account creation date and the organisation baseline (run without --no-baseline).</p>`; return; }
  const rateUnit = d => d.unit === "count" ? "num" : d.unit;
  const rows = state.summary.metric_defs.filter(d => t.metrics[d.key]).map(d => {
    const m = t.metrics[d.key];
    return { label: d.key === "review_ratio" ? d.label : `${d.label} / ${t.rate_days} days`,
             tip: metricTip(d) + (d.key === "review_ratio" ? "" : `\nHere: per ${t.rate_days} days of their time in the window.`),
             unit: rateUnit(d), value: m.value, pct: m.pct, stats: m };
  });
  el.innerHTML = `<h2>Compared with members of similar tenure <span class="muted" style="font-weight:400">· in the company ${tenureText(t.tenure_days)}</span></h2>
    <p class="sub">Members who have been in <b>${esc(state.summary.org.login)}</b> between ${tenureText(t.range_days[0])} and ${tenureText(t.range_days[1])}
      (${t.low}× to ${t.high}× this person's ${tenureText(t.tenure_days)}): ${t.active_members} with PR activity, of ${t.members}.
      Tenure counts from the GitHub account creation date. Everyone is measured <b>per ${t.rate_days} days of their own time in the window</b>
      (this person: ${t.own_days} days), so someone who has been here longer does not win on totals alone.</p>
    ${t.active_members < 5 ? `<div class="banner">Only ${t.active_members} comparable member(s): treat these percentiles as rough.</div>` : ""}
    <div id="tenure-strips"></div>`;
  distStrip($("#tenure-strips", el), rows, { who: p.login, population: "members of similar tenure", n: t.active_members, medianLabel: "peer median" });
}

// ------------------------------------------------------------------ sections
// Shown above everything: how (not) to use these numbers.
function renderCaveat() {
  return `<section class="caveat" role="note" aria-label="How to use this report">
    <h2>Read this before using the numbers</h2>
    <ul>
      <li><b>Don't rely on these numbers alone to evaluate a person.</b> Use them as a starting point for a conversation,
        together with what teammates, leads and the work itself say.</li>
      <li><b>They are not enough to judge someone's contribution.</b> Much of what matters cannot be measured correctly,
        even when there is a number for it: design and architecture, mentoring, unblocking others, incident and on-call work,
        requirements and JIRA work, the difficulty and impact of a change, and how much rework it saves later.
        Volume metrics (PRs, commits, lines) are easy to inflate and say nothing about quality.</li>
      <li><b>They say nothing about a person's character.</b> Teamwork, curiosity, listening, presentation, transparency,
        open-mindedness, adaptability and many other qualities that make someone valuable to a team cannot be seen in
        GitHub activity at all.</li>
      <li><b>What the numbers mean will change over time.</b> For example, review counts and review comments mean something
        different once people use AI to generate review comments automatically. Approval counts mean something different
        in teams that let members approve and merge their own PRs, or that don't require approval at all. Compare people
        only within the same period and similar team practices, and re-check what a metric still means before using it.</li>
    </ul>
  </section>`;
}

function renderProblems() {
  const p = state.manifest.problems || [];
  return p.length ? `<div class="banner"><b>${p.length} problem(s) while collecting - some numbers may be incomplete:</b><ul>${p.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
}

const OVERVIEW_COLS = ["prs_merged", "prs_reviewed", "review_comments", "commits", "cycle_time_median_h", "review_turnaround_median_h", "active_days"];

function renderOverview(el) {
  const s = state.summary, groups = [...new Set(s.metric_defs.map(d => d.group))];
  const multi = s.people.length > 1;
  el.innerHTML = `
    <h2>Overview</h2>
    <p class="sub">Group score = average percentile of that group's metrics, turned so 100 is always the good end and 50 is typical.
      ${multi ? `Ranked within the people in this report.` : `Only one person in the report, so scores use the organisation ranks where they exist.`}
      Someone who joined during the window is ranked over the same days only, against people who were already in the company.
      Click a row to open the person; click a header to sort.</p>
    <div class="scroll"><table id="overview-table">
      <thead><tr><th class="l" data-k="login">Person</th>
        <th class="l" data-k="window" data-tip="People who joined during the window are compared over the same days only, with members who were already there">Compared over</th>
        ${groups.map(g => `<th data-k="g:${esc(g)}">${esc(g)}</th>`).join("")}
        ${OVERVIEW_COLS.map(k => `<th data-k="${k}" data-tip="${esc(metricTip(state.defs[k]))}">${esc(state.defs[k].label)}</th>`).join("")}
      </tr></thead><tbody></tbody></table></div>`;
  let sortKey = "login", asc = true;
  const val = (p, k) => k === "login" ? p.login.toLowerCase() : k === "window" ? p.comparison.days : k.startsWith("g:") ? p.group_scores[k.slice(2)] : p.metrics[k];
  const draw = () => {
    const rows = [...s.people].sort((a, b) => {
      const x = val(a, sortKey), y = val(b, sortKey);
      if (x === y) return 0; if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1;
      return (x < y ? -1 : 1) * (asc ? 1 : -1);
    });
    $("tbody", el).innerHTML = rows.map(p => `
      <tr data-login="${esc(p.login)}" class="${p.login === state.current ? "selected" : ""}" style="cursor:pointer">
        <td>${esc(p.name || p.login)} <span class="muted">${p.name ? esc(p.login) : ""}</span>${p.role === "peer" ? '<span class="chip">peer</span>' : ""}</td>
        <td class="l">${p.comparison.days} days${joinedLate(p) ? ` <span class="chip">joined ${date10(p.comparison.joined)}</span>` : ""}</td>
        ${groups.map(g => { const v = p.group_scores[g]; return `<td class="score" style="${scoreStyle(v)}">${v === undefined ? "–" : Math.round(v)}</td>`; }).join("")}
        ${OVERVIEW_COLS.map(k => `<td>${fmt(p.metrics[k], state.defs[k].unit)}</td>`).join("")}
      </tr>`).join("");
    el.querySelectorAll("th").forEach(th => th.classList.toggle("sorted", th.dataset.k === sortKey));
    el.querySelectorAll("th.sorted").forEach(th => th.classList.toggle("asc", asc));
  };
  el.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    if (sortKey === th.dataset.k) asc = !asc; else { sortKey = th.dataset.k; asc = th.dataset.k === "login"; }
    draw();
  }));
  el.addEventListener("click", e => { const tr = e.target.closest("tr[data-login]"); if (tr) selectPerson(tr.dataset.login); });
  draw();
}

const TILES = ["prs_merged", "reviews_given", "commits", "review_comments", "cycle_time_median_h", "review_turnaround_median_h", "active_days", "repos_contributed"];

function rankText(r) {
  const parts = [];
  if (r.org_pct !== undefined && r.org_pct !== null) parts.push(`org ${fmtPct(r.org_pct)}`);
  if (r.cohort_pct !== undefined && r.cohort_pct !== null) parts.push(`cohort ${fmtPct(r.cohort_pct)}`);
  return parts.join(" · ") || "&nbsp;";
}

// joiners are compared over their own window; a late first activity without a late join is only flagged
function tenureNote(p, u) {
  const first = u.series.first_activity;
  if (joinedLate(p)) {
    const c = p.comparison, base = baselineFor(p);
    return `<div class="banner">Joined on <b>${date10(c.joined)}</b> (GitHub account created), so every comparison uses the same window:
      <b>${windowText(p)}</b>. The organisation baseline is counted over those days, for the
      ${base ? base.eligible_members : "?"} members who were already in the company (${base ? base.active_members : "?"} of them active)${
      c.cohort.length > 1 ? `, and the ${c.cohort.length - 1} other ${c.cohort.length === 2 ? "person" : "people"} in this report ${c.cohort.length === 2 ? "is" : "are"} measured over the same days` : ""}.</div>`;
  }
  if (!first) return `<div class="banner">No GitHub activity in this window.</div>`;
  const late = (new Date(first) - new Date(state.manifest.from)) / 864e5;
  return late > 60 ? `<div class="banner">First activity in the window is <b>${first}</b>, ${Math.round(late)} days after it starts, although
    the account is older (transfer, leave or role change?). Totals are compared with people active for the whole period; re-run with
    <code>--days</code> covering only the active span for a like-for-like comparison.</div>`
    : `<p class="sub">Active from ${first} to ${u.series.last_activity}. Compared over ${windowText(p)}.</p>`;
}

  const prof = u.profile, defs = state.summary.metric_defs;

  el.innerHTML = `
    <div class="person">
      ${prof.avatarUrl ? `<img src="${esc(prof.avatarUrl)}" alt="">` : ""}
      <div><div class="name">${esc(prof.name || prof.login)}${p.role === "peer" ? '<span class="chip">peer</span>' : ""}</div>
        <div class="login"><a href="${esc(prof.url)}" target="_blank" rel="noopener">${esc(prof.login)}</a>${prof.company ? " · " + esc(prof.company) : ""}</div></div>
    </div>
    ${tenureNote(p, u)}
    <div class="tiles score-tiles" style="margin-bottom:12px">
      ${groups.map(([g, v]) => `<div class="tile" data-tip="${esc(g)} score: average percentile of the group's ranked metrics (100 = best end, 50 = typical)">
        <div class="label">${esc(g)}</div><div class="value">${Math.round(v)}<span class="muted" style="font-size:13px"> / 100</span></div>

    </div>
    <div class="tiles">
      ${TILES.map(k => { const d = state.defs[k], r = p.ranks[k] || {};
        return `<div class="tile" data-tip="${esc(metricTip(d))}"><div class="label">${esc(d.label)}</div>
          <div class="value">${fmt(p.metrics[k], d.unit)}</div><div class="rank">${rankText(r)}</div></div>`; }).join("")}
    </div>`;
}

function renderCompany(el, login) {
  const p = state.summary.people.find(x => x.login === login);
  const b = baselineFor(p);
  el.innerHTML = `<h2>Compared with the company <span class="muted" style="font-weight:400">· ${windowText(p)}</span></h2>

function renderMetrics(el, login) {

  el.innerHTML = `<h2>All metrics</h2>
    <p class="sub">Values cover the whole report window; medians and percentiles compare over ${windowText(p)}.

    <div class="scroll" style="max-height:none"><table>
      <thead><tr><th class="l">Metric</th><th>Value</th>
        ${multi ? "<th>Cohort median</th><th>Cohort pct</th>" : ""}
        ${base ? "<th>Org median</th><th>Org pct</th>" : ""}<th>Score</th><th class="l">Direction</th></tr></thead>
      <tbody>${groups.map(g => `<tr class="group-row"><td colspan="8">${esc(g)}</td></tr>` +

            <td class="l muted">${better[d.better] || "context only"}</td></tr>`;

// ------------------------------------------------------------------ what kind of work
const heat = (v, max) => v ? `background: color-mix(in srgb, var(--series-1) ${Math.round(8 + 40 * v / Math.max(max, 1))}%, transparent)` : "";
const catDesc = (kind, name) => {
  for (const c of state.summary.categories?.[kind] || []) {
    if (c.name === name) return c.desc;
    const child = (c.children || []).find(x => x.name === name);
    if (child) return child.desc;
  }
  return "";
};

function shareCell(n, total) {
  const pct = total ? 100 * n / total : 0;
  return `<td class="l" style="min-width:160px"><span style="display:inline-block;width:110px;height:8px;background:var(--surface-2);border-radius:4px;vertical-align:middle">
    <span style="display:block;height:8px;width:${pct.toFixed(1)}%;background:var(--series-1);border-radius:0 4px 4px 0"></span></span>
    <span style="font-variant-numeric:tabular-nums"> ${n} <span class="muted">(${Math.round(pct)}%)</span></span></td>`;
}

function mixTable(rows, kind, nameKey, total, extraHead = "", extraCell = () => "") {
  if (!rows.length) return `<p class="empty">No pull requests in this window.</p>`;
  return `<div class="scroll"><table><thead><tr><th class="l">${kind === "areas" ? "Area" : "Change type"}</th>
    <th class="l">PRs (main ${kind === "areas" ? "area" : "type"})</th>${extraHead}<th>Merged</th><th>Lines +</th><th>Lines −</th>
    <th>Median size</th><th>Median open → merged</th><th>Repos</th><th>With tests</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.level === 0 ? "parent-row" : r.level === 1 ? "child-row" : ""}"><td class="l" data-tip="${esc(catDesc(kind, r[nameKey]))}">${r.level === 1 ? '<span class="muted">\u2514 </span>' : ""}${esc(r.label || r[nameKey])}</td>${shareCell(r.prs, total)}${extraCell(r)}
      <td>${fmt(r.merged)}</td><td>${fmt(r.additions)}</td><td>${fmt(r.deletions)}</td><td>${fmt(r.size_median)}</td>
      <td>${fmt(r.cycle_median_h, "hours")}</td><td>${fmt(r.repos)}</td><td>${r.prs ? Math.round(100 * r.with_tests / r.prs) + "%" : "–"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function heatTable(rows, cols, rowKey, rowLabel, colLabel) {
  const max = Math.max(1, ...rows.flatMap(r => cols.map(c => r[c] || 0)));
  return `<div class="scroll"><table><thead><tr><th class="l">${esc(rowLabel)}</th>${cols.map(c => `<th data-tip="${esc(c)}">${esc(colLabel(c))}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${rows.map(r => { const total = cols.reduce((a, c) => a + (r[c] || 0), 0);
      return `<tr><td class="l">${esc(r[rowKey])}</td>${cols.map(c => `<td style="${heat(r[c] || 0, max)}" data-tip="${esc(`${r[rowKey]} · ${c}: ${r[c] || 0} PR(s)`)}">${r[c] || ""}</td>`).join("")}<td><b>${total}</b></td></tr>`; }).join("")}
    </tbody></table></div>`;
}

// Languages and frameworks per area (parents in bold, their parts below)
function techTable(tech) {
  if (!tech) return "";
  const langs = r => r.languages.filter(l => l.share >= 0.02 || r.languages.length <= 3).slice(0, 5).map(l =>
    `<span data-tip="${esc(`${l.name}: ${Math.round(100 * l.share)}% of the changed lines in ${r.label}\n${fmt(l.lines)} lines in ${fmt(l.files)} file change(s)`)}">${esc(l.name)} <span class="muted">${Math.round(100 * l.share)}%</span></span>`).join(" · ");
  const fws = r => r.frameworks.length ? r.frameworks.slice(0, r.level ? 6 : 12).map(f =>
    `<span class="chip" style="margin:0 4px 3px 0" data-tip="${esc(`${f.name}: used in ${f.prs} of their PRs in ${r.label}\n${f.source === "files" ? "Seen in the files they changed." : "Listed in the dependency manifest (pom.xml, package.json...) of a repo where they changed " + r.label + " files."}`)}">${esc(f.name)} ${f.prs}</span>`).join("") : '<span class="muted">–</span>';
  return `<h3 class="chart-title" style="margin-top:18px">Languages &amp; frameworks by area</h3>
    <p class="sub" style="margin-bottom:6px">Languages = share of the changed lines in that area. Frameworks and tools = from the repositories' dependency manifests and from
      the changed files, counted in the PRs where they apply (the number is PRs). A framework shows only where the person worked in that part of a repo that uses it.</p>
    <div class="scroll"><table><thead><tr><th class="l">Area</th><th class="l">Languages</th><th class="l">Frameworks &amp; tools</th></tr></thead><tbody>
    ${tech.by_area.map(r => `<tr class="${r.level ? "child-row" : "parent-row"}"><td class="l" data-tip="${esc(catDesc("areas", r.area))}">${r.level ? '<span class="muted">└ </span>' : ""}${esc(r.label)}</td>
      <td class="wrap">${langs(r)}</td><td class="wrap" style="max-width:640px">${fws(r)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderMix(el, login) {
  const u = state.users[login], w = u.series.work_mix, p = state.summary.people.find(x => x.login === login);
  if (!w) { el.innerHTML = `<h2>What kind of work</h2><p class="empty">This report was generated before PR classification existed.</p>`; return; }
  const total = u.pull_requests.length;
  const parents = w.areas.filter(a => a.level !== 1);
  const topAreas = parents.filter(a => a.prs).map(a => a.area);
  const topTypes = w.types.slice(0, 8).map(t => t.type);
  const monthLabel = m => { const [y, mo] = m.split("-"); return MONTHS[mo - 1]; };
  const areaMonthRows = topAreas.map(a => ({ area: a, ...Object.fromEntries(w.area_monthly.map(m => [m.month, m[a] || 0])) }));
  const months = w.area_monthly.map(m => m.month);
  const crossRows = topTypes.map(t => ({ type: t, ...Object.fromEntries(w.type_by_area.filter(x => x.type === t).map(x => [x.area, x.prs])) }));
  const reviewedTotal = w.review_areas.reduce((a, r) => a + r.prs, 0);
  const lead = parents[0], leadChild = w.areas.find(a => a.level === 1 && a.parent === lead?.area), leadType = w.types[0];
  el.innerHTML = `<h2>What kind of work</h2>
    <p class="sub">Every PR gets one <b>area</b> (the part of the system where most of its changed lines are; lock files and other generated files
      count as only a few lines) and one <b>change type</b> (from a conventional-commit prefix, the title, the branch name, then the files).
      Hover a name for its rule; the full list is at the bottom of the page.${w.partial_prs ? ` ${w.partial_prs} PR(s) changed over 100 files and were classified from their first 100.` : ""}</p>
    ${lead ? `<div class="tiles" style="margin-bottom:14px">
      <div class="tile"><div class="label">Main area</div><div class="value" style="font-size:20px">${esc(lead.area)}</div><div class="rank">${lead.prs} of ${total} PRs \u00b7 ${Math.round(100 * lead.line_share)}% of changed lines${leadChild ? ` \u00b7 mostly ${esc(leadChild.label)}` : ""}</div></div>
      <div class="tile"><div class="label">Most common change</div><div class="value" style="font-size:20px">${esc(leadType.type)}</div><div class="rank">${leadType.prs} of ${total} PRs</div></div>
      <div class="tile" data-tip="${esc(metricTip(state.defs.areas_worked))}"><div class="label">Areas worked in</div><div class="value">${fmt(p.metrics.areas_worked)}</div><div class="rank">top-level areas with at least one PR</div></div>
      <div class="tile" data-tip="${esc(metricTip(state.defs.tests_included_share))}"><div class="label">Code PRs that include tests</div><div class="value">${fmt(p.metrics.tests_included_share, "pct")}</div><div class="rank">${rankText(p.ranks.tests_included_share || {})}</div></div>
    </div>` : ""}
    <h3 class="chart-title">By area <span class="muted" style="font-weight:400">(top-level areas in bold, with their parts below; each PR counts once)</span></h3>
    ${mixTable(w.areas, "areas", "area", total,
      `<th>Touched by</th><th>Line share</th>`,
      r => `<td>${fmt(r.prs_touching)}</td><td>${Math.round(100 * r.line_share)}%</td>`)}
    ${techTable(w.tech)}
    <h3 class="chart-title" style="margin-top:18px">By change type</h3>
    ${mixTable(w.types, "types", "type", total)}
    <div class="grid2" style="margin-top:18px">
      <div><h3 class="chart-title">Main area by month (PRs opened)</h3>${heatTable(areaMonthRows, months, "area", "Area", monthLabel)}</div>
      <div><h3 class="chart-title">Change type × area (PRs)</h3>${heatTable(crossRows, topAreas, "type", "Type \\ area", a => a)}</div>
      <div><h3 class="chart-title">Most-changed directories (lines)</h3><div id="mix-dirs"></div></div>
      <div><h3 class="chart-title" data-tip="Every changed file in their PRs, by extension. Includes test, config and docs files: hover a bar to see which areas they belong to.">File types changed (number of files, incl. tests)</h3><div id="mix-ext"></div></div>
      <div><h3 class="chart-title" data-tip="All files changed in their PRs, by language, weighted by changed lines (lock and generated files count as a few lines).">Languages they change (share of lines)</h3><div id="mix-langs"></div></div>
      <div><h3 class="chart-title" data-tip="Languages of the PRs they reviewed, weighted by the lines in those PRs. Shows which codebases they can review.">Languages of the PRs they review</h3><div id="mix-rev-langs"></div></div>
      <div><h3 class="chart-title">Areas of the PRs they review (${reviewedTotal} PRs)</h3><div id="mix-rev-areas"></div></div>
      <div><h3 class="chart-title">Kinds of PRs they review</h3><div id="mix-rev-types"></div></div>
    </div>`;
  hbars($("#mix-dirs", el), w.top_dirs, { label: r => r.dir, value: r => r.lines, tipFn: r => `${r.dir}\n${fmt(r.lines)} lines in ${r.prs} PR(s)` });
  const langTip = r => `${r.name}: ${Math.round(100 * r.share)}% of changed lines\n${fmt(r.lines)} lines in ${fmt(r.files)} file change(s)`;
  hbars($("#mix-langs", el), w.tech?.languages || [], { label: r => r.name, value: r => r.share, unit: "pct", tipFn: langTip, max: 1 });
  hbars($("#mix-rev-langs", el), w.tech?.review_languages || [], { label: r => r.name, value: r => r.share, unit: "pct", tipFn: langTip, max: 1 });
  hbars($("#mix-ext", el), w.file_types, { label: r => r.ext, value: r => r.files,
    tipFn: r => `${r.ext}: ${r.files} file change(s)\n` + Object.entries(r.areas || {}).map(([a, n]) => `${a}: ${n}`).join("\n") });
  hbars($("#mix-rev-areas", el), w.review_areas, { label: r => r.area, value: r => r.prs,
    tipFn: r => `${r.area}: ${r.prs} PRs reviewed \u00b7 ${fmt(r.lines)} lines\n` + Object.entries(r.children || {}).map(([c, n]) => `${c}: ${n}`).join("\n") });
  hbars($("#mix-rev-types", el), w.review_types, { label: r => r.type, value: r => r.prs });
}

const PR_COLS = [
  { k: "repository", t: "Repo", l: true, v: p => (p.repository || "").split("/").pop() },
  { k: "title", t: "Title", l: true, v: p => p.title },
  { k: "area", t: "Area", l: true, v: p => p.area || "" },
  { k: "type", t: "Type", l: true, v: p => p.type || "" },
  { k: "state", t: "State", l: true, v: p => p.state },
  { k: "createdAt", t: "Opened", v: p => p.createdAt, f: date10 },
  { k: "size", t: "Lines", v: p => p.additions + p.deletions, f: v => fmt(v) },
  { k: "changedFiles", t: "Files", v: p => p.changedFiles, f: v => fmt(v) },
  { k: "commits", t: "Commits", v: p => p.commits, f: v => fmt(v) },
  { k: "cycle", t: "Open → merged", v: p => hoursBetween(p.createdAt, p.mergedAt), f: v => fmt(v, "hours") },
  { k: "reviews", t: "Human reviews", v: p => p.reviews.filter(r => !r.bot && r.author !== p.author).length, f: v => fmt(v) },
  { k: "mergedBy", t: "Merged by", l: true, v: p => p.mergedBy || "" },
];

function renderPRs(el, login) {
  const u = state.users[login];
  el.innerHTML = `<h2>Pull requests opened <span class="muted" style="font-weight:400">(${u.pull_requests.length})</span></h2>
    <p class="sub"><input type="search" id="pr-filter" placeholder="Filter by repo, title, state, area, type..."></p>
    <div class="scroll"><table><thead><tr>${PR_COLS.map(c => `<th class="${c.l ? "l" : ""}" data-k="${c.k}">${c.t}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <h2 style="margin-top:22px">Reviews given <span class="muted" style="font-weight:400">(${u.reviews.length})</span></h2>
    <div class="scroll"><table><thead><tr><th class="l">Submitted</th><th class="l">Repo</th><th class="l">PR</th><th class="l">Author</th><th class="l">Outcome</th><th>Inline comments</th><th>PR lines</th><th>Hours after PR opened</th></tr></thead>
    <tbody>${[...u.reviews].sort((a, b) => b.submittedAt.localeCompare(a.submittedAt)).map(r => `<tr>
      <td class="l">${date10(r.submittedAt)}</td><td class="l">${esc((r.repository || "").split("/").pop())}</td>
      <td class="wrap"><a href="${esc(r.pr_url)}" target="_blank" rel="noopener">#${r.pr_number}</a> ${esc(r.pr_title)}</td>
      <td class="l">${esc(r.pr_author)}</td><td class="l">${esc(r.state)}</td><td>${r.comments}</td><td>${fmt(r.pr_size)}</td>
      <td>${fmt(hoursBetween(r.pr_createdAt, r.submittedAt), "hours")}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No reviews in this window.</td></tr>`}</tbody></table></div>`;
  const body = $("tbody", el);
  const draw = () => {
    const q = ($("#pr-filter", el).value || "").toLowerCase();
    const col = PR_COLS.find(c => c.k === state.prSort.key);
    const rows = u.pull_requests.filter(p => !q || `${p.repository} ${p.title} ${p.state} ${p.area} ${p.type}`.toLowerCase().includes(q))
      .sort((a, b) => { const x = col.v(a), y = col.v(b);
        if (x === y) return 0; if (x === null) return 1; if (y === null) return -1;
        return (x < y ? -1 : 1) * (state.prSort.asc ? 1 : -1); });
    body.innerHTML = rows.map(p => `<tr>${PR_COLS.map(c => {
      const v = c.v(p);
      if (c.k === "title") return `<td class="wrap"><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number}</a> ${esc(v)}${p.isDraft ? ' <span class="chip">draft</span>' : ""}</td>`;
      return `<td class="${c.l ? "l" : ""}">${esc(c.f ? c.f(v) : v)}</td>`; }).join("")}</tr>`).join("")
      || `<tr><td colspan="${PR_COLS.length}" class="empty">No pull requests.</td></tr>`;
    el.querySelectorAll("thead th[data-k]").forEach(th => { th.classList.toggle("sorted", th.dataset.k === state.prSort.key); th.classList.toggle("asc", state.prSort.asc); });
  };
  el.querySelectorAll("thead th[data-k]").forEach(th => th.addEventListener("click", () => {
    state.prSort = { key: th.dataset.k, asc: state.prSort.key === th.dataset.k ? !state.prSort.asc : false }; draw(); }));
  $("#pr-filter", el).addEventListener("input", draw);
  draw();
}

function renderCost(el) {
  const m = state.manifest, c = m.run_cost || {}, ai = c.ai || {};
  const per = Object.entries(c.per_person || {});
  el.innerHTML = `<h2>Run cost</h2>
    <p class="sub">What it took to build this report. Data version <b>v${esc(m.data_version ?? "?")}</b>: raw data stored by an earlier
      run with the same version is reused, and only the days it does not cover (plus the last ${"14"} days before that run, to pick up
      late merges and reviews) are fetched again.</p>
    <div class="tiles" style="margin-bottom:14px">
      <div class="tile"><div class="label">GitHub API calls</div><div class="value">${fmt(c.github_api_calls ?? m.api_calls)}</div><div class="rank">GraphQL + REST search, all people + baselines</div></div>
      <div class="tile" data-tip="${esc(ai.note || "")}"><div class="label">AI tokens</div><div class="value">${fmt((ai.input_tokens || 0) + (ai.output_tokens || 0))}</div>
        <div class="rank">${ai.used ? `${fmt(ai.input_tokens)} in / ${fmt(ai.output_tokens)} out · ${esc(ai.model)}` : "no AI model is called"}</div></div>
      <div class="tile"><div class="label">AI cost</div><div class="value">$${(ai.cost_usd || 0).toFixed(2)}</div><div class="rank">${esc(ai.note || "")}</div></div>
    </div>
    ${per.length ? `<div class="scroll"><table><thead><tr><th class="l">Person</th><th class="l">Stored data reused</th><th class="l">Ranges fetched this run</th></tr></thead><tbody>
      ${per.map(([login, f]) => f ? `<tr><td class="l">${esc(login)}</td><td class="l">${f.reused_store ? "yes" : "no (first run or new version)"}</td>
        <td class="l">${f.ranges.length ? f.ranges.map(r => `${r[0]} → ${r[1]}`).join(", ") : "none (all stored)"}</td></tr>` : "").join("")}</tbody></table></div>` : ""}`;
}

function renderGlossary(el) {
  const s = state.summary, groups = [...new Set(s.metric_defs.map(d => d.group))];
  el.innerHTML = `<h2>How to read this</h2>
    <p class="sub">These numbers describe activity on GitHub, not the value of the work. Use them to start a conversation:
      on-call, design, mentoring, meetings and JIRA work do not show up here, and volume metrics (lines, commits) are easy to inflate.
      Compare people with similar roles and tenure.</p>
    ${groups.map(g => `<h3 class="chart-title" style="margin-top:12px">${esc(g)}</h3><table><tbody>${
      s.metric_defs.filter(d => d.group === g).map(d => `<tr><td class="l" style="width:260px"><b>${esc(d.label)}</b></td><td class="wrap" style="max-width:none">${esc(d.desc)}${d.read ? `<br><span class="muted">How to read it: ${esc(d.read)}</span>` : ""}</td></tr>`).join("")}</tbody></table>`).join("")}
    ${s.categories ? `<h3 class="chart-title" style="margin-top:12px">PR areas (top-level area, then its parts)</h3><table><tbody>${
      s.categories.areas.map(c => `<tr class="parent-row"><td class="l" style="width:260px">${esc(c.name)}</td><td class="wrap" style="max-width:none">${esc(c.desc)}</td></tr>` +
        (c.children || []).map(x => `<tr class="child-row"><td class="l">${esc(x.short || x.name)}</td><td class="wrap" style="max-width:none">${esc(x.desc)}</td></tr>`).join("")).join("")}</tbody></table>
      <h3 class="chart-title" style="margin-top:12px">PR change types (first match wins, in this order)</h3><table><tbody>${s.categories.types.map(c =>
        `<tr><td class="l" style="width:260px"><b>${esc(c.name)}</b></td><td class="wrap" style="max-width:none">${esc(c.desc)}</td></tr>`).join("")}</tbody></table>` : ""}`;
}

// ------------------------------------------------------------------ wiring
function selectPerson(login) {
  state.current = login;
  $("#person-select").value = login;
  history.replaceState(null, "", "#" + encodeURIComponent(login));
  document.querySelectorAll("#overview-table tr[data-login]").forEach(tr => tr.classList.toggle("selected", tr.dataset.login === login));
  for (const [id, fn] of [["person-card", renderPerson], ["company-card", renderCompany], ["tenure-card", renderTenure], ["activity-card", renderActivity],
                          ["work-card", renderWork], ["mix-card", renderMix], ["metrics-card", renderMetrics], ["prs-card", renderPRs]]) fn($("#" + id), login);
}

async function getJSON(path) {
  // data/report-data.js (loaded above) carries every JSON file, so the page also
  // works when opened straight from disk; over HTTP without it, fetch the file.
  const key = path.replace(/^data\//, "");
  if (window.REPORT_DATA && key in window.REPORT_DATA) return window.REPORT_DATA[key];
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
  return r.json();
}

async function load() {
  try {
    state.manifest = await getJSON("data/manifest.json");
    state.summary = await getJSON("data/" + state.manifest.summary);
    await Promise.all((state.manifest.org_baselines || []).map(async f => { state.baselines[f] = await getJSON("data/" + f); }));
    await Promise.all(state.manifest.people.map(async p => { state.users[p.login] = await getJSON("data/" + p.file); }));
  } catch (err) {
    $("#app").innerHTML = `<section class="card"><h2>Could not load the report data</h2>
      <p>${esc(err.message)}</p><p class="sub">The data file <code>data/report-data.js</code> next to this page is missing or unreadable (reports made before it existed
      do not have it). Run <code>python github_performance.py --view &lt;this folder&gt;</code> once: it adds the file, after which this
      page also opens straight from disk.</p></section>`;
    $("#meta").textContent = "";
    return;
  }
  state.summary.metric_defs.forEach(d => state.defs[d.key] = d);
  const m = state.manifest;
  $("#meta").textContent = `${state.summary.org.name || m.org} · ${date10(m.from)} → ${date10(m.to)} (${m.days} days) · generated ${date10(m.generated_at)} · data v${m.data_version ?? "?"}`;
  const sel = $("#person-select");
  sel.innerHTML = m.people.map(p => `<option value="${esc(p.login)}">${esc(p.name || p.login)}${p.role === "peer" ? " (peer)" : ""}</option>`).join("");
  sel.addEventListener("change", () => selectPerson(sel.value));

  $("#app").innerHTML = `${renderCaveat()}${renderProblems()}
    <section class="card" id="overview-card"></section>
    <section class="card" id="person-card"></section>
    <section class="card" id="company-card"></section>
    <section class="card" id="tenure-card"></section>
    <section class="card" id="activity-card"></section>
    <section class="card" id="work-card"></section>
    <section class="card" id="mix-card"></section>
    <section class="card" id="metrics-card"></section>
    <section class="card" id="prs-card"></section>
    <section class="card" id="glossary-card"></section>
    <section class="card" id="cost-card"></section>`;
  renderOverview($("#overview-card"));
  renderGlossary($("#glossary-card"));
  renderCost($("#cost-card"));
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const first = m.people.find(p => p.login === fromHash) || m.people.find(p => p.role === "target") || m.people[0];
  selectPerson(first.login);
  let resizeTimer;
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => renderActivity($("#activity-card"), state.current), 150); });
}

$("#theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  localStorage.setItem("gh-perf-theme", root.dataset.theme);
});
if (localStorage.getItem("gh-perf-theme")) document.documentElement.dataset.theme = localStorage.getItem("gh-perf-theme");
load();
</script>
